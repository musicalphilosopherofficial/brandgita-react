        <h1>Brand Gita</h1>
        <p>Brand Gita is a content tool for creators and small businesses. It helps
        creators turn one long-form video into a week of branded short-form content.</p>
        <h2>Publishing &amp; scheduling to Instagram and YouTube</h2>
        <p>Creators connect their own Instagram and YouTube accounts and grant Brand
        Gita permission to publish on their behalf. Brand Gita then schedules and posts
        their own videos (Reels) and image carousels to their own accounts at the times
        they choose — no manual uploads, no third-party scheduler. Brand Gita only uses
        this access to publish the content creators make and ask it to post; it is never
        used for any other purpose.</p>
