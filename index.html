        <h1>Brand Gita</h1>
        <p>Brand Gita is a content tool for creators and small businesses. It helps
        creators turn one hour of long-form content into 30 days of on-brand carousels.</p>
        <h2>Publishing &amp; scheduling to Instagram, YouTube and TikTok</h2>
        <p>Creators connect their own Instagram, YouTube and TikTok accounts and grant Brand
        Gita permission to publish on their behalf. Brand Gita then schedules and posts
        their own videos (Reels) and image carousels to their own accounts at the times
        they choose, and to TikTok only after the creator reviews and confirms each post — no manual uploads, no third-party scheduler. Brand Gita only uses
        this access to publish the content creators make and ask it to post; it is never
        used for any other purpose.</p>
