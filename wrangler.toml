name = "brandgita-react"
compatibility_date = "2024-01-01"
pages_build_output_dir = "dist"

[[d1_databases]]
binding = "DB"
database_name = "brandgita-waitlist"
database_id = "c0c56a08-861b-402b-813d-cd8734e8977a"

[[r2_buckets]]
binding = "SCHEDULE_BUCKET"
bucket_name = "brandgita-scheduled"

# ── Rate limiting — NOT configurable here ────────────────────────────────────
# A [[ratelimits]] block was added and REMOVED on 2026-08-21. Wrangler rejects it for a
# Pages project outright:
#
#     Configuration file for Pages projects does not support "ratelimits"
#
# and the failure is not confined to deploys — the block breaks EVERY `wrangler pages`
# command, including `pages secret put`. Do not re-add it.
#
# Worth recording precisely, because the local evidence points the other way: `wrangler
# pages dev` DOES honour the binding (it prints `env.TOKEN_LIMITER (10 requests/60s)
# Rate Limit` and genuinely returns 429 after 10 requests). Local dev is more permissive
# than the platform. A limiter proven to work locally therefore proves nothing about
# Pages, which is exactly why the consuming code fails open.
#
# The rate limit for /api/token is instead a WAF Rate Limiting Rule, configured in the
# Cloudflare dashboard — no code, and the free plan allows exactly one such rule.
# See decisions/public-endpoint-hardening.md.
